name: hugo-build

on: [push, pull_request, workflow_dispatch]


jobs:
  make-www:
    runs-on: ubuntu-slim
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: install hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
      - name: run make www
        run: |
          make www
      - name: git status
        run: |
          git status
      - name: git diff (non-deleted)
        run: |
          git diff --color  --diff-filter=d
