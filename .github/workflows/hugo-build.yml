name: hugo-build

on: [push, pull_request, workflow_dispatch]

defaults:
  run:
    shell: bash -exuo pipefail {0}

jobs:
  make-www:
    runs-on: ubuntu-slim
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: src/
      - name: install hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: 'latest'
      - name: run make www
        run: |
          make www
      - name: git status
        run: |
          git status
      - name: git diff (non-deleted)
        run: |
          git diff --color  --diff-filter=d
