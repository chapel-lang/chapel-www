name: check-unused-artifacts

on: pull_request

jobs:
  check-unused-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: checkout commits on PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: check for unused artifacts
        run: |
          #!/usr/bin/env bash

          # Just look at the merge commit created by the checkout action for
          # the PR.
          git diff -U0 HEAD^1 HEAD > diff.txt
          ./src/check-unused-artifacts.sh ./src/data/artifacts.toml diff.txt

