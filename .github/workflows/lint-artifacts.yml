name: lint-artifacts

on:
  push:
    branches: [ main ]
    paths:
      - "src/data/artifacts.toml"
      - "src/lint_artifacts.py"
      - ".github/**"
  pull_request:
    paths:
      # copied from push event paths
      - "src/data/artifacts.toml"
      - "src/lint_artifacts.py"
      - ".github/**"
  workflow_dispatch:


jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: run artifacts linter
        run: |
          python ./src/lint_artifacts.py ./src/data/artifacts.toml
