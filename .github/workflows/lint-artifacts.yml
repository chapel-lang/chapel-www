name: lint-artifacts

on:
  push:
    branches: [ main ]
    paths:
      - "src/data/artifacts.toml"
      - "src/lint_artifacts.py"
      - ".github/**"
  pull_request:
    paths:
      # copied from push event paths
      - "src/data/artifacts.toml"
      - "src/lint_artifacts.py"
      - ".github/**"
  workflow_dispatch:

permissions:
    contents: read

defaults:
  run:
    shell: bash -exuo pipefail {0}

jobs:
  lint:
    runs-on: ubuntu-slim
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: run artifacts linter
        run: |
          python ./src/util/lint_artifacts.py ./src/data/artifacts.toml
