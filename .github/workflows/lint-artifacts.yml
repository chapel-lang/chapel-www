name: lint-artifacts

on:
  push:
    branches: [ main ]
    paths:
      - "src/data/artifacts.toml"
      - "src/lint_artifacts.py"
      - ".github/**"
  pull_request:
    paths:
      # copied from push event paths
      - "src/data/artifacts.toml"
      - "src/lint_artifacts.py"
      - ".github/**"
  workflow_dispatch:

defaults:
  run:
    shell: bash -exuo pipefail {0}

jobs:
  lint:
    runs-on: ubuntu-slim
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: src/
      - name: run artifacts linter
        run: |
          python ./src/util/lint_artifacts.py ./src/data/artifacts.toml
